[project]
name = "techinar"
version = "0.1.0"
description = "A beginner-friendly machine learning starter for high school students"
readme = "README.md"
authors = [
    { name = "Greg Graham", email = "greg@grahamtx.net" }
]
requires-python = ">=3.13,<3.14"
dependencies = [
    "ipykernel>=7.4.0",
    "matplotlib>=3.11.2",
    "numpy>=2.5.3",
    "pandas>=3.0.6",
    "scikit-learn>=1.9.1",
]

[project.scripts]
techinar = "techinar:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.14.0",
]

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I"]
